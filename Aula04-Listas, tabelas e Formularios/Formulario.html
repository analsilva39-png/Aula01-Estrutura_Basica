<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.
    0">
    <title>Formulários</title>
</head>
<body>
    <section>
        <h2>Formulário</h2>
        <form action="cadastro.php" method="post">
            <p><label>Nome:</label>
                <input type="text" name="nome" placeholder="Digite seu nome" required>
            </p>
            <p><label>Senha:</label>
                <input type="password" name="senha" required maxlength="8" placeholder="Digite sua senha" required>
            </p>
            <p><label>email:</label>
                <input type="email" name="email" placeholder="Digite seu email" required>
            </p>
            <p><label>Telefone:</label>
                <input type="text" name="Telefone" pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}" placeholder="(00) 0000-0000" required>
            </p>
            <p><label>Cep:</label>
                <input type="text" name="Cep" pattern="[0-9]{5}-[0-9]{3}" placeholder="00000-000" required title="Use o formato:(00)00000-0000">
            </p>
             <p><label>Sobre você:</label>
                <textarea name="bio" rows="10" cols="100"></textarea>
            </p>
            <p><label>Gênero:</label>
                <input type="radio" name="genero" value="M"> Masculino
                <input type="radio" name="genero" value="F"> Feminino
            </p>
            <p><label>Interesse:</label>
                <input type="checkbox" name="Interesses" value="tecnologia"> Tecnologia 
                <input type="checkbox" name="Interesses" value="esportes"> Esportes 
                <input type="checkbox" name="Interesses" value="artes"> artes
            </p>
            <p><label>País:</label>
                <select name="país">
                    <option value="">---</option>
                    <option value="brasil">Brasil</option>
                    <option value="argentina">Argentina</option>
                    <option value="chile">Chile  </option>
                </select>
            </p>
            <p><label>Foto de Perfil:</label>
                <input type="file" name="foto">
            </p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </form>
    </section>
</body>
    
</html>
